<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Datos | Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at center, #161b22 0%, #0d1117 100%);
        }
        .tech-card {
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid #30363d;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.1);
            width: 100%;
            max-width: 500px;
        }
        .form-control {
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 12px;
        }
        .form-control:focus {
            background-color: #0d1117;
            border-color: #58a6ff;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.4);
            color: #fff;
        }
        .btn-neon {
            background-color: transparent;
            color: #58a6ff;
            border: 2px solid #58a6ff;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            margin-bottom: 15px;
        }
        .btn-neon:hover {
            background-color: #58a6ff;
            color: #0d1117;
            box-shadow: 0 0 20px #58a6ff;
        }
    </style>
</head>
<body>
    <div class="tech-card">
        <h3 class="text-center mb-4" style="color: #58a6ff; text-shadow: 0 0 10px rgba(88,166,255,0.5);">PORTAL DE INGRESO</h3>
        <form action="controlador/logica.php" method="post">
            <div class="mb-4">
                <label class="form-label text-secondary">Nombre del Operario:</label>
                <input type="text" name="nom" required class="form-control" autocomplete="off">
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary">Frecuencia (Tel):</label>
                <input type="number" name="tel" required class="form-control" autocomplete="off">
            </div>
            <div class="mb-5">
                <label class="form-label text-secondary">Detalles:</label>
                <textarea name="det" required class="form-control" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-neon py-2 fw-bold">Transmitir Datos</button>
        </form>
        <form action="controlador/logica.php" method="post">
            <input type="hidden" name="nom" value="--">
            <input type="hidden" name="tel" value="0">
            <input type="hidden" name="det" value="Consulta de tabla">
            <button type="submit" class="btn btn-neon py-2 fw-bold" style="color: #2ea043; border-color: #2ea043;">Ver Registros del Sistema</button>
        </form>
    </div>
</body>
</html>
